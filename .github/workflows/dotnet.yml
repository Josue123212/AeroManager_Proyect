name: .NET CI/CD Build & Publish

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Aeromanager.Api/Aeromanager.Api.csproj

      - name: Build application
        run: dotnet build Aeromanager.Api/Aeromanager.Api.csproj --configuration Release --no-restore

      - name: Publish application
        run: dotnet publish Aeromanager.Api/Aeromanager.Api.csproj --configuration Release --no-build --output ./published

      - name: Upload published artifact (Deploy Ready)
        uses: actions/upload-artifact@v4
        with:
          name: aeromanager-api-release
          path: ./published
